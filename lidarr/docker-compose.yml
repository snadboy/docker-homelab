services:
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    labels:
      - "docktail.service.enable=true"
      - "docktail.service.name=lidarr"
      - "docktail.service.port=8686"
      - "docktail.service.service-port=443"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      - lidarr-data:/config
      - /mnt/media/Music:/music
      - /mnt/docker/downloads:/downloads
    ports:
      - 8686:8686
    restart: unless-stopped

volumes:
  lidarr-data:
    external: true

# Explicit subnet: Docker's default 172.17-172.31 pool is exhausted on arr, and
# on-demand 192.168.x.0/20 allocations are counting down to a collision with the
# LAN (see "arr bridge-pool countdown" in CLAUDE.md). This keeps lidarr out of it.
networks:
  default:
    ipam:
      config:
        - subnet: 10.201.0.0/24
