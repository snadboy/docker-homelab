# Managed by Ansible — roles/tailscaled-runtime-dir. Do not edit by hand.
#
# WHY THIS EXISTS
#
# tailscaled.service ships with `RuntimeDirectory=tailscale`. systemd creates
# /run/tailscale on start and DELETES it on stop, so every tailscaled restart
# recreates the directory with a NEW inode.
#
# Containers that bind-mount /var/run/tailscale (docktail, one per docker host)
# resolve that bind at container-create time. When the directory is replaced the
# container keeps the OLD, now-orphaned inode and sees an empty directory
# forever, failing with:
#
#   dial unix /var/run/tailscale/tailscaled.sock: connect: no such file or directory
#
# ...while the socket is plainly present on the host. Observed 2026-08-01 on
# bedrock: host inode 1377486 vs container inode 987802.
#
# The failure is quiet and dangerous: DockTail can no longer reconcile, but the
# services it already published keep working, because their approved
# advertisements live in tailscaled's own prefs. So nothing looks broken until
# someone restarts the container -- which re-registers every service and can
# leave the host advertising services the control plane has no host record for,
# taking them all down at once. That took 8 services off bedrock.
#
# RuntimeDirectoryPreserve=yes keeps /run/tailscale across restarts, so the
# inode is stable and the bind mount stays valid. tailscaled recreates the
# socket inside the same directory.
#
# Takes effect from the next tailscaled stop; applying it needs only a
# daemon-reload, with no restart and no service impact.

[Service]
RuntimeDirectoryPreserve=yes
