# Server for the ESP32-C6 AMOLED radar display -- source and docs:
# https://github.com/snadboy/amoled-radar
services:
  amoled-radar:
    # Pinned to a build, NOT :latest. Dockhand's auto-update only redeploys when git
    # changes ("No changes detected, skipping redeploy"), and a new :latest image
    # changes nothing in git -- so it would never be picked up. To ship a server
    # change, bump this tag to the new amoled-radar commit; that IS a git change.
    image: ghcr.io/snadboy/amoled-radar:9d24f12ef298e760b8d52ebe96c5be4462e6554d
    container_name: amoled-radar
    restart: unless-stopped
    # LAN port for the display itself. The ESP32 can't run Tailscale, so it can't use
    # radar.swallow-spectrum.ts.net; it fetches http://192.168.86.135:8098 instead.
    ports:
      - "8098:8080"
    environment:
      HASS_SERVER: ${HASS_SERVER}
      HASS_TOKEN: ${HASS_TOKEN}
      # Cities (Geneva / St. Louis / Canton) are defined in serve.py. Override with a
      # JSON list in RADAR_CITIES if they ever change.
      PORT: "8080"
      RADAR_FRAMES: "12"
      RADAR_REFRESH_S: "600"    # RainViewer publishes a new frame every 10 min
      STATUS_REFRESH_S: "60"    # keeps the outdoor reading fresh
    volumes:
      - amoled-radar-cache:/cache   # basemap is fetched once and cached here
    labels:
      - "docktail.service.enable=true"
      - "docktail.service.name=radar"
      - "docktail.service.port=8080"
      - "docktail.service.service-port=443"

volumes:
  amoled-radar-cache:
