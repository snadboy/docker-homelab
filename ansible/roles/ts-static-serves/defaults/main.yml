---
# Static Tailscale Services advertised (for HA) by every host in ts_advertisers.
# Each host runs `tailscale serve --service=svc:<name> --https=443 --bg <target>`.
# Tailscale routes to any available advertiser and fails over automatically.
#
# Service DEFINITIONS (with tag:ts-service) are created out-of-band via the
# Tailscale API — see scratchpad/static-services.txt / the migration doc. This
# role only manages the per-host serve config (the drift-prone part).
#
# proto note: PVE/PBS/UniFi backends are HTTPS with self-signed certs -> https+insecure.
ts_static_services:
  - { name: euler,         target: "https+insecure://192.168.86.107:8006" }  # pve-euler UI
  - { name: gauss,         target: "https+insecure://192.168.86.109:8006" }  # pve-gauss UI
  - { name: maxwell,       target: "https+insecure://192.168.86.105:8006" }  # pve-maxwell UI
  - { name: faraday,       target: "https+insecure://192.168.86.111:8006" }  # pve-faraday UI
  - { name: alexandria,    target: "https+insecure://192.168.86.144:8007" }  # PBS
  - { name: svalbard,      target: "https+insecure://192.168.86.87:8007" }   # PBS
  - { name: unifi,         target: "https+insecure://192.168.86.1:443" }     # UniFi network app
  - { name: ha,            target: "http://192.168.86.224:8123" }            # Home Assistant
  - { name: technitium,    target: "http://192.168.86.76:5380" }             # DNS (svc:ns collides w/ device ns)
  - { name: pkdb,          target: "http://192.168.86.160:8484" }            # pkdb VM (migrated off sdevs 2026-07-12) 
  - { name: plex,          target: "http://192.168.86.40:32400" }            # web UI only
  - { name: homelab-bar,   target: "http://192.168.86.164:3000" }
  - { name: media,         target: "https+insecure://192.168.86.27:5001" }    # Synology DSM (syn-media; svc:syn-media collides w/ device)
  - { name: unas-able,     target: "https+insecure://192.168.86.65:443" }     # UNAS Pro Able (hosts shareables)
  - { name: unas-baker,    target: "https+insecure://192.168.86.148:443" }    # UNAS Pro Baker
  # Static rather than DockTail even though it IS a container: it runs in the
  # plex LXC (CT 107), which has no Tailscale node and no docktail agent.
  # Moved off arr 2026-08-05 — arr had no GPU render node, only a qxl display.
  - { name: gpu-benchmark, target: "http://192.168.86.40:8088" }             # transcode benchmark, plex LXC (Arc iGPU)
  # Agent of Empires dashboard on sdevs. LAN ip, NOT sdevs' tailnet ip: `tailscale
  # serve` cannot proxy to another node's tailnet address — it accepts the TLS
  # connection and hangs forever, no journal error, no request reaching the backend
  # (verified 2026-09-25, cost an hour). Every other entry here is 192.168.86.x for
  # the same reason. aoe also needs a matching --allowed-host for this name or it
  # answers 403 to the proxied Host header; see claude-config/systemd/user/aoe.service.
  - { name: aoe,           target: "http://192.168.86.220:8080" }            # Agent of Empires, sdevs (token auth)
  # SLZB-MR1U adapter web UIs (SLZB-OS). These are the LIVE Zigbee coordinators —
  # z2m talks to their radio-2 socket on :7638 (upstairs ch20, basement ch25), and
  # upstairs radio-1 is the Thread radio. The SLZB-06M units are retired spares.
  # Plain HTTP on :80; /ha_sensors is the real temp source (HA's SMLIGHT temp
  # sensors read 50-65 C high and are not trustworthy).
  - { name: slzb-upstairs, target: "http://192.168.86.130" }                 # office
  - { name: slzb-basement, target: "http://192.168.86.245" }                 # laundry
  # Dedicated Matter/Thread border routers (SLZB-06MG24U, single-radio, EFR32MG24).
  # Separate boxes from the MR1U coordinators above: one radio each, so these do
  # Thread ONLY and Zigbee stays on the MR1Us. slzb-basement-thread is pending the
  # second unit. Target the new network at 802.15.4 ch 15 — the last quiet slot
  # (WiFi is on 1/6/11; Google-C617 Thread is ch 11; Zigbee is ch 20 and ch 25).
  - { name: slzb-upstairs-thread, target: "http://192.168.86.39" }            # office, Thread BR

# Hub (mini-homepage) landing pages — static HTML served as Tailscale Services.
# Generated by /usr/local/bin/ts-gen-hubs (refreshed by ts-hubs.timer). HA: both
# advertisers serve their own generated copy.
ts_hubs:
  - home      # index of EVERY service (discovered, not hand-listed) — the only name to remember
  - proxmox   # Proxmox VE nodes + guests, and PBS datastores (merged)
  - servarr   # media automation stack — grouped app links
  - containers # all docker containers, grouped by host + node
  - zigbee    # Z2M servers + SLZB coordinator radios (health + links)
