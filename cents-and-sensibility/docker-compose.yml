# Cents and Sensibility (was Sense and Cents until 2026-11-01): household finance (SimpleFIN -> Postgres -> FastAPI).
# Source: https://github.com/snadboy/cents-and-sensibility (private; utilities is logged in to ghcr).
#
# Deployed BY HAND on utilities from the ~/docker-homelab clone (like firefly-iii):
#   cd ~/docker-homelab && git pull && cd cents-and-sensibility && docker compose up -d
# Secrets live in .env next to this file (see .env.example), never in git.
# Tailscale only: no host port. DockTail proxies straight to the container IP, so the
# app and uploaded statements are not reachable from the LAN (port 5020 closed 2026-10-23).
# Pinned to a build SHA, not :latest; bump the tag to ship a new version.
services:
  cents:
    image: ghcr.io/snadboy/cents-and-sensibility:6fa62e69953bd09020ead2377eb5a17173da76b9
    container_name: cents-and-sensibility
    restart: unless-stopped
    depends_on:
      cents-db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg://sense:${DB_PASSWORD}@cents-db:5432/sense
      - SIMPLEFIN_ACCESS_URL=${SIMPLEFIN_ACCESS_URL}
      - EXCLUDE_ACCOUNTS=${EXCLUDE_ACCOUNTS:-}
      - SYNC_TIME=${SYNC_TIME:-05:30}
      - TZ=America/Chicago
      - KUMA_PUSH_URL=${KUMA_PUSH_URL:-}
      # Claude reads attached statements (empty = attach only)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # review queue suggestions (empty = defaults: claude-sonnet-5-5, 150 groups/run, 25/request)
      - SUGGEST_MODEL=${SUGGEST_MODEL:-}
      - SUGGEST_MAX_GROUPS=${SUGGEST_MAX_GROUPS:-}
      - SUGGEST_BATCH_SIZE=${SUGGEST_BATCH_SIZE:-}
      - FILES_DIR=/data/files
    volumes:
      # attached statements (personal financial documents): back up with sense-db
      - sense-files:/data/files
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
    labels:
      - "docktail.service.enable=true"
      - "docktail.service.name=cents"
      - "docktail.service.port=8000"
      - "docktail.service.service-port=443"
    networks:
      - cents-internal

  cents-db:
    image: postgres:16-alpine
    container_name: cents-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=sense
      - POSTGRES_USER=sense
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "sense"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - sense-db:/var/lib/postgresql/data
    networks:
      - cents-internal

networks:
  cents-internal:
    name: cents-internal

# the data keeps its original names (database, user and volumes 'sense'): renaming them means moving the data
volumes:
  sense-db:
    name: sense-db
  sense-files:
    name: sense-files
