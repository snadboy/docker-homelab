services:
  transcoding-gpu-benchmark:
    image: spaceinvaderone/transcoding-gpu-benchmark:latest
    container_name: transcoding-gpu-benchmark
    # Runs on the plex LXC (CT 107 on pve-euler) because that is where the Intel
    # Arc iGPU actually is: /dev/dri/renderD128 on the i915 driver, bind-mounted
    # into the container by the LXC config. It lived on arr until 2026-08-05,
    # where the only DRM node was a qxl virtual display with no render node, so
    # no GPU test was possible at all.
    #
    # ⚠️ This CONTENDS WITH PLEX for the same iGPU. The benchmark saturates the
    # GPU by design, so a run will degrade or stall live Plex hardware
    # transcodes. Run it when nobody is watching.
    devices:
      - /dev/dri:/dev/dri
    # renderD128 is root:kvm 660 in the LXC; the container runs as root, so no
    # group_add is needed. If that ever changes, add the kvm gid here.
    volumes:
      - tgb-config:/config              # ~1.8 GB of test clips, downloaded on first run
      - /etc/os-release:/os-release:ro  # host OS detection
    tmpfs:
      - /ramdisk:rw,size=512m
    ports:
      - 8088:8088
    restart: unless-stopped

volumes:
  tgb-config:
    external: true

# No DockTail labels: plex-lxc has no Tailscale node and runs no docktail agent.
# gpu-benchmark.swallow-spectrum.ts.net is served the same way plex itself is —
# the static-serve path, via ansible/roles/ts-static-serves proxying to
# 192.168.86.40:8088 from the tsvc-able / tsvc-baker advertisers.
