services:
  arr-dashboard:
    image: khak1s/arr-dashboard:latest
    container_name: arr-dashboard
    labels:
      - "docktail.service.enable=true"
      - "docktail.service.name=arr-dashboard"
      - "docktail.service.port=3000"
      - "docktail.service.service-port=443"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - WEBAUTHN_RP_NAME=Arr Dashboard
      - WEBAUTHN_RP_ID=arr-dashboard.swallow-spectrum.ts.net
      - WEBAUTHN_ORIGIN=https://arr-dashboard.swallow-spectrum.ts.net
    volumes:
      - arr-dashboard-data:/config
    ports:
      - 3005:3000
    restart: unless-stopped

volumes:
  arr-dashboard-data:
    external: true
