services:
  tainer:
    image: tainersh/tainer:latest
    container_name: tainer
    restart: unless-stopped
    ports:
      - "3003:3000"
    volumes:
      - tainer-data:/app/data
    # AUTH_SECRET lives in the gitignored .env (see .env.example). Required since the
    # 2026-10 image: tainer now refuses to start in production without it and will no
    # longer fall back to auth-secret.txt in the data dir. Missing -> exit 1 restart loop.
    env_file: .env
    environment:
      APP_URL: https://tainer.isnadboy.com
    labels:
      - "snadboy.revp.3000.domain=tainer.isnadboy.com"
      - "docktail.service.enable=true"
      - "docktail.service.name=tainer"
      - "docktail.service.port=3000"
      - "docktail.service.service-port=443"

volumes:
  tainer-data:
