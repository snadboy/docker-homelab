---
- name: Ensure docker.service.d exists
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: "0755"

- name: Deploy canonical wait-for-mounts drop-in
  ansible.builtin.template:
    src: wait-for-mounts.conf.j2
    dest: /etc/systemd/system/docker.service.d/wait-for-mounts.conf
    mode: "0644"
  register: dropin

- name: Remove legacy hand-applied drop-ins
  ansible.builtin.file:
    path: "/etc/systemd/system/docker.service.d/{{ item }}"
    state: absent
  loop: "{{ docker_legacy_dropins }}"
  register: legacy

# Deliberately only daemon-reload. Restarting docker would bounce every container
# on the host; the ordering this sets only takes effect at the next boot anyway.
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: dropin.changed or legacy.changed

- name: Show effective ordering
  ansible.builtin.command: systemctl show docker -p After -p Requires -p RequiresMountsFor
  changed_when: false
  register: eff

- name: Report
  ansible.builtin.debug:
    msg: "{{ eff.stdout_lines | select('search', 'mnt-docker|remote-fs') | list }}"
