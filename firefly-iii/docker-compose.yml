# RETIRED 2026-10-23: replaced by Sense and Cents (sense-and-cents/). Stack stopped with
# 'docker compose down' on utilities; its external data volumes were KEPT (Firefly's hold
# the 26 categories and 168 rules phase 2 imports; dump in utilities:~/backups/finance/).
# Kuma monitors paused. Don't 'up' this without re-adding them to the HA outage automation.
services:
  firefly-iii:
    image: fireflyiii/core:latest
    container_name: firefly-iii
    restart: unless-stopped
    depends_on:
      - firefly-db
    labels:
      - "snadboy.revp.8080.domain=firefly.isnadboy.com"
      - "docktail.service.enable=true"
      - "docktail.service.name=firefly"
      - "docktail.service.port=8080"
      - "docktail.service.service-port=443"
    ports:
      - "5010:8080"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - SITE_OWNER=${SITE_OWNER}
      - APP_KEY=${APP_KEY}
      - DEFAULT_LANGUAGE=en_US
      - DEFAULT_LOCALE=en_US
      - TZ=America/Chicago
      - TRUSTED_PROXIES=**
      - STATIC_CRON_TOKEN=${STATIC_CRON_TOKEN}
      # OAuth signing keys live on a volume: regenerating them on every recreate
      # silently invalidates every personal access token (incl. the importer's)
      - PASSPORT_PRIVATE_KEY_FILE=/var/www/html/storage/passport/oauth-private.key
      - PASSPORT_PUBLIC_KEY_FILE=/var/www/html/storage/passport/oauth-public.key
      - LOG_CHANNEL=stack
      - APP_LOG_LEVEL=notice
      - AUDIT_LOG_LEVEL=emergency
      # Database
      - DB_CONNECTION=pgsql
      - DB_HOST=firefly-db
      - DB_PORT=5432
      - DB_DATABASE=firefly
      - DB_USERNAME=firefly
      - DB_PASSWORD=${DB_PASSWORD}
      # Cache/Session
      - CACHE_DRIVER=file
      - SESSION_DRIVER=file
      # Features
      - ALLOW_WEBHOOKS=true
      - ENABLE_EXCHANGE_RATES=true
      - ENABLE_EXTERNAL_RATES=true
      # Mail disabled
      - MAIL_MAILER=log
    volumes:
      - firefly-upload:/var/www/html/storage/upload
      - firefly-passport:/var/www/html/storage/passport:ro
    networks:
      - firefly-internal

  firefly-db:
    image: postgres:15-alpine
    container_name: firefly-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=firefly
      - POSTGRES_USER=firefly
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - firefly-db:/var/lib/postgresql/data
    networks:
      - firefly-internal

  firefly-importer:
    image: fireflyiii/data-importer:latest
    container_name: firefly-importer
    restart: unless-stopped
    depends_on:
      - firefly-iii
    labels:
      - "snadboy.revp.8080.domain=firefly-import.isnadboy.com"
      - "docktail.service.enable=true"
      - "docktail.service.name=firefly-import"
      - "docktail.service.port=8080"
      - "docktail.service.service-port=443"
    ports:
      - "5011:8080"
    environment:
      - FIREFLY_III_URL=http://firefly-iii:8080
      - VANITY_URL=https://firefly.isnadboy.com
      - FIREFLY_III_ACCESS_TOKEN=${IMPORTER_ACCESS_TOKEN:-}
      - SIMPLEFIN_TOKEN=${SIMPLEFIN_TOKEN:-}
      - TZ=America/Chicago
      - TRUSTED_PROXIES=**
      # Auto import settings
      - AUTO_IMPORT_SECRET=${AUTO_IMPORT_SECRET:-}
      - CAN_POST_AUTOIMPORT=true
      - CAN_POST_FILES=true
      # firefly-cron imports every config JSON saved here
      - IMPORT_DIR_ALLOWLIST=/var/www/html/storage/configurations
    volumes:
      - firefly-importer-configs:/var/www/html/storage/configurations
    networks:
      - firefly-internal

  firefly-cron:
    image: alpine:latest
    container_name: firefly-cron
    restart: unless-stopped
    depends_on:
      - firefly-iii
      - firefly-importer
    command: ["/bin/sh", "/firefly-cron.sh", "start"]
    environment:
      - STATIC_CRON_TOKEN=${STATIC_CRON_TOKEN}
      - AUTO_IMPORT_SECRET=${AUTO_IMPORT_SECRET}
      - IMPORT_DIR=/var/www/html/storage/configurations
      # Uptime Kuma push URL, pinged after each successful import (empty = off)
      - KUMA_PUSH_URL=${KUMA_PUSH_URL:-}
    volumes:
      - ./firefly-cron.sh:/firefly-cron.sh:ro
    networks:
      - firefly-internal

networks:
  firefly-internal:
    name: firefly-internal

volumes:
  firefly-upload:
    external: true
  firefly-passport:
    external: true
  firefly-db:
    external: true
  firefly-importer-configs:
    external: true
