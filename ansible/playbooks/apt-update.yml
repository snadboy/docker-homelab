- name: Apply system updates (SSH hosts)
  hosts: apt_hosts
  become: true
  gather_facts: true
  any_errors_fatal: false
  max_fail_percentage: 100
  # Ansible reaches these hosts over Tailscale SSH with NO ssh keys — the tailnet
  # session IS the connection. An apt run that restarts tailscaled (the tailscale
  # package upgrading itself, or needrestart bouncing it after libpam/libssl) cuts
  # the branch we are sitting on: apt completes, Ansible never hears back, host is
  # marked UNREACHABLE. If EVERY host in a play goes that way the play aborts and
  # takes all later plays with it (that is how plex-lxc silently missed 25 days of
  # updates, 2026-08-15 → 2026-09-09). Two guards below:
  #   ignore_unreachable  — a dropped host stays in the play, so the play can never
  #                         end with zero hosts and abort the ones after it.
  #   NEEDRESTART_MODE=l  — needrestart lists services to restart instead of
  #                         restarting them, so a libpam bump stops bouncing tailscaled.
  # The third guard (detached apt + async_status) is on the upgrade task itself.
  ignore_unreachable: true
  environment:
    NEEDRESTART_MODE: l
  tasks:
    - block:
        - name: Count security updates pending
          ansible.builtin.shell: |
            set -o pipefail
            apt-get -s -o Debug::NoLocking=true upgrade 2>/dev/null \
              | grep -E '^Inst .*security' | wc -l
          args:
            executable: /bin/bash
          register: sec_count
          changed_when: false
          failed_when: false

        - name: Update apt cache
          apt:
            update_cache: true
            cache_valid_time: 3600

        # Detached on purpose: poll:0 returns immediately, so no SSH session is
        # held open across the upgrade. tailscaled can restart mid-apt and nothing
        # is lost — the work continues server-side and we collect it below.
        - name: Upgrade all packages (detached)
          apt:
            upgrade: dist
            autoremove: true
            autoclean: true
          async: 3600
          poll: 0
          register: upgrade_job

        # Reconnects to collect the result. If tailscaled bounced, a poll fails and
        # is simply retried — 120 x 15s = 30 min ceiling, against apt runs of 1-3 min.
        - name: Wait for the upgrade to finish
          async_status:
            jid: "{{ upgrade_job.ansible_job_id }}"
          register: upgrade_result
          until: upgrade_result.finished | default(false) | bool
          retries: 120
          delay: 15
          failed_when: false
          when: upgrade_job.ansible_job_id is defined

        - name: Check if reboot required
          stat:
            path: /var/run/reboot-required
          register: reboot_file

        # Skipped when the host never actually answered — leaving apt_status unset
        # lets the bulletin play synthesise a proper 'unreachable' row for it,
        # instead of this recording a false 'ok'.
        - name: Record per-host apt status (success)
          set_fact:
            apt_status:
              host: "{{ inventory_hostname }}"
              section: "{{ _apt_section }}"
              upgraded_line: "{{ (upgrade_result.stdout_lines | default([])) | select('match', '^\\d+ upgraded,') | list | first | default('No changes') }}"
              reboot: "{{ reboot_file.stat.exists | default(false) }}"
              security_count: "{{ (sec_count.stdout | default('0') | trim) | int }}"
              status: "{{ 'warn' if reboot_file.stat.exists | default(false) else 'ok' }}"
              error: ""
          when: not (upgrade_result.unreachable | default(false) | bool)
      rescue:
        - name: Record per-host apt status (failure)
          set_fact:
            apt_status:
              host: "{{ inventory_hostname }}"
              section: "{{ _apt_section }}"
              upgraded_line: ""
              reboot: false
              security_count: 0
              status: "error"
              error: "{{ (ansible_failed_result.msg | default('task failed'))[:160] }}"
  vars:
    _apt_section: >-
      {%- if inventory_hostname in groups['pve_nodes'] -%}pve_nodes
      {%- elif inventory_hostname in groups['pbs_servers'] -%}pbs_servers
      {%- elif inventory_hostname in groups['ubuntu_vms'] -%}ubuntu_vms
      {%- elif inventory_hostname in groups['workstations'] | default([]) -%}workstations
      {%- else -%}other
      {%- endif -%}

- name: Apply system updates (Pi appliances, DKMS reboot guard)
  hosts: pi_appliances
  become: true
  gather_facts: false
  any_errors_fatal: false
  max_fail_percentage: 100
  # Only two hosts here, so "both dropped" = a 100%-failed play = every later play
  # skipped. That is exactly what happened on 2026-08-29 and 2026-09-01 when the
  # tailscale package upgraded itself and restarted tailscaled on both Pis at once.
  # See the header on the SSH play for the mechanism.
  ignore_unreachable: true
  environment:
    NEEDRESTART_MODE: l
  tasks:
    - block:
        # safe-update = apt full-upgrade + verify the WiFi DKMS module exists
        # for the next-boot kernel. Its RESULT line is the reboot verdict; this
        # play NEVER reboots (matching the other plays) — the verdict just
        # controls how loudly the bulletin flags the host.
        # Detached for the same reason as the SSH play — safe-update runs
        # apt full-upgrade, which is what restarts tailscaled underneath us.
        - name: Run guarded update (safe-update, detached)
          ansible.builtin.command: /usr/local/bin/safe-update
          async: 1800
          poll: 0
          register: safeu_job

        - name: Wait for safe-update to finish
          async_status:
            jid: "{{ safeu_job.ansible_job_id }}"
          register: safeu
          until: safeu.finished | default(false) | bool
          retries: 90
          delay: 15
          failed_when: false
          changed_when: "'0 upgraded, 0 newly installed' not in (safeu.stdout | default(''))"
          when: safeu_job.ansible_job_id is defined

        - name: Record per-host apt status
          when: not (safeu.unreachable | default(false) | bool)
          set_fact:
            apt_status:
              host: "{{ inventory_hostname }}"
              section: "pi_appliances"
              upgraded_line: "{{ (safeu.stdout_lines | default([])) | select('match', '^\\d+ upgraded,') | list | first | default('No changes') }}"
              reboot: "{{ 'SAFE TO REBOOT' in (safeu.stdout | default('')) }}"
              security_count: 0
              status: >-
                {%- if 'DO NOT REBOOT' in (safeu.stdout | default('')) or (safeu.rc | default(1)) != 0 -%}error
                {%- elif 'SAFE TO REBOOT' in (safeu.stdout | default('')) -%}warn
                {%- else -%}ok
                {%- endif -%}
              error: "{{ 'DKMS guard: DO NOT REBOOT — WiFi module missing for next-boot kernel' if 'DO NOT REBOOT' in (safeu.stdout | default('')) else '' }}"
      rescue:
        - name: Record per-host apt status (failure)
          set_fact:
            apt_status:
              host: "{{ inventory_hostname }}"
              section: "pi_appliances"
              upgraded_line: ""
              reboot: false
              security_count: 0
              status: "error"
              error: "{{ (ansible_failed_result.msg | default('safe-update failed'))[:160] }}"

- name: Apply system updates (LXC containers via pct exec)
  hosts: lxc_containers
  gather_facts: false
  any_errors_fatal: false
  max_fail_percentage: 100
  # Lower risk than the SSH plays (apt runs inside the CT, so it cannot restart the
  # PVE node's tailscaled) but guarded the same way so this play can never be the
  # one that aborts the bulletin summary.
  ignore_unreachable: true
  tasks:
    - block:
        - name: Run apt update and upgrade in container
          delegate_to: "{{ pve_host }}"
          become: false
          vars:
            ansible_user: root
          ansible.builtin.shell: |
            pct exec {{ pve_vmid }} -- bash -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get upgrade -y 2>&1 | tail -20
              apt-get autoremove -y -qq
              if [ -f /var/run/reboot-required ]; then echo REBOOT=1; else echo REBOOT=0; fi
            '
          register: lxc_result

        - name: Record per-host apt status (success)
          set_fact:
            apt_status:
              host: "{{ inventory_hostname }}"
              section: "lxc_containers"
              upgraded_line: "{{ (lxc_result.stdout_lines | default([])) | select('match', '^\\d+ upgraded,') | list | first | default('No changes') }}"
              reboot: "{{ 'REBOOT=1' in (lxc_result.stdout | default('')) }}"
              security_count: 0
              status: "{{ 'warn' if 'REBOOT=1' in (lxc_result.stdout | default('')) else 'ok' }}"
              error: ""
      rescue:
        - name: Record per-host apt status (failure)
          set_fact:
            apt_status:
              host: "{{ inventory_hostname }}"
              section: "lxc_containers"
              upgraded_line: ""
              reboot: false
              security_count: 0
              status: "error"
              error: "{{ (ansible_failed_result.msg | default('pct exec failed'))[:160] }}"

- name: Post apt-update summary to bulletin board
  hosts: localhost
  gather_facts: false
  connection: local
  vars:
    # Override inventory-wide ansible_become=true (semaphore container has no sudo)
    ansible_become: false
    run_iso: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
    run_date: "{{ lookup('pipe', 'date -u +%Y-%m-%d') }}"
    run_hm: "{{ lookup('pipe', 'date -u +%H:%M') }}"
    bulletin_api_url: "{{ lookup('env', 'BULLETIN_API_URL') | default('https://bulletin.swallow-spectrum.ts.net/api/post', true) }}"
    bulletin_api_key: "{{ lookup('env', 'BULLETIN_API_KEY') | default('', true) }}"
    semaphore_url: "{{ lookup('env', 'SEMAPHORE_URL') | default('https://semaphore.swallow-spectrum.ts.net', true) }}"
    semaphore_project_id: "{{ lookup('env', 'SEMAPHORE_PROJECT_ID') | default('1', true) }}"
    semaphore_link: "{{ semaphore_url }}/project/{{ semaphore_project_id }}"
    reporting_hosts: "{{ (groups['apt_hosts'] | default([])) + (groups['lxc_containers'] | default([])) + (groups['pi_appliances'] | default([])) }}"
  tasks:
    - name: Collect per-host apt_status facts (where set)
      set_fact:
        summary_items: >-
          {{
            reporting_hosts
            | map('extract', hostvars, 'apt_status')
            | select('defined')
            | list
          }}

    - name: Identify hosts with no apt_status (unreachable)
      set_fact:
        unreachable_hosts: >-
          {{
            reporting_hosts
            | reject('in', (summary_items | map(attribute='host') | list))
            | list
          }}

    - name: Synthesise entries for unreachable hosts
      set_fact:
        summary_items: "{{ summary_items + [_u] }}"
      vars:
        _section: >-
          {%- if item in (groups['pve_nodes'] | default([])) -%}pve_nodes
          {%- elif item in (groups['pbs_servers'] | default([])) -%}pbs_servers
          {%- elif item in (groups['ubuntu_vms'] | default([])) -%}ubuntu_vms
          {%- elif item in (groups['workstations'] | default([])) -%}workstations
          {%- elif item in (groups['lxc_containers'] | default([])) -%}lxc_containers
          {%- elif item in (groups['pi_appliances'] | default([])) -%}pi_appliances
          {%- else -%}other
          {%- endif -%}
        _u:
          host: "{{ item }}"
          section: "{{ _section }}"
          upgraded_line: ""
          reboot: false
          security_count: 0
          status: "error"
          error: "unreachable"
      loop: "{{ unreachable_hosts }}"

    - name: Synthesise entries for managed_locally hosts (unattended-upgrades)
      set_fact:
        summary_items: "{{ summary_items + [_m] }}"
      vars:
        _m:
          host: "{{ item }}"
          section: "managed_locally"
          upgraded_line: "unattended-upgrades (not Ansible-managed)"
          reboot: false
          security_count: 0
          status: "ok"
          error: ""
      loop: "{{ groups['managed_locally'] | default([]) }}"

    - name: Build bulletin items payload
      set_fact:
        bulletin_items: "{{ bulletin_items | default([]) + [_item] }}"
      vars:
        h: "{{ item }}"
        sec_note: "{% if (h.security_count | int) > 0 %} ({{ h.security_count }} security){% endif %}"
        reboot_note: "{% if h.reboot %} · reboot required{% endif %}"
        sub: >-
          {%- if h.status == 'error' -%}error: {{ h.error }}
          {%- elif h.upgraded_line in ['', 'No changes'] -%}no changes{{ reboot_note }}
          {%- else -%}{{ h.upgraded_line }}{{ sec_note }}{{ reboot_note }}
          {%- endif -%}
        _item:
          title: "{{ h.host }}"
          subtitle: "{{ sub }}"
          section: "{{ h.section }}"
          status: "{{ h.status }}"
      loop: "{{ summary_items }}"

    - name: Compute aggregate stats
      set_fact:
        total_hosts: "{{ summary_items | length }}"
        error_hosts: "{{ summary_items | selectattr('status', 'eq', 'error') | list | length }}"
        reboot_hosts: "{{ summary_items | selectattr('reboot', 'equalto', true) | list | length }}"
        clean_hosts: "{{ summary_items | selectattr('status', 'eq', 'ok') | list | length }}"
        total_security: "{{ summary_items | map(attribute='security_count') | map('int') | sum }}"

    - name: Pick embed color by severity
      set_fact:
        overall_color: >-
          {%- if (error_hosts | int) > 0 -%}15158332
          {%- elif (reboot_hosts | int) > 0 -%}15105570
          {%- else -%}3066993
          {%- endif -%}

    - name: POST apt-update summary to bulletin
      uri:
        url: "{{ bulletin_api_url }}"
        method: POST
        headers:
          X-API-Key: "{{ bulletin_api_key }}"
          Content-Type: application/json
        body_format: json
        status_code: [200, 201]
        body:
          source: ansible
          topic: apt-update
          embed:
            title: "apt-update · {{ run_date }} {{ run_hm }}"
            description: |-
              [View in Semaphore]({{ semaphore_link }})

              {{ total_hosts }} hosts · **{{ clean_hosts }}** clean · **{{ reboot_hosts }}** need reboot · **{{ error_hosts }}** errors{% if (total_security | int) > 0 %} · **{{ total_security }}** pending security pkgs{% endif %}
            color: "{{ overall_color | int }}"
            footer:
              text: "Ansible · Semaphore · dist-upgrade (security + regular) · {{ run_iso }}"
            items: "{{ bulletin_items }}"
      when: bulletin_api_key | length > 0
      register: bulletin_post_result

    - name: Warn if bulletin API key missing
      debug:
        msg: "BULLETIN_API_KEY not set — summary not posted to bulletin board"
      when: bulletin_api_key | length == 0

    - name: Display bulletin post outcome
      debug:
        msg: "Posted {{ total_hosts }} hosts to bulletin ({{ clean_hosts }} clean, {{ reboot_hosts }} reboot, {{ error_hosts }} error)"
      when: bulletin_api_key | length > 0
