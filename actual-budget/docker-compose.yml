# RETIRED 2026-10-23: replaced by Sense and Cents (sense-and-cents/). Stack stopped with
# 'docker compose down' on utilities; its external data volumes were KEPT (Firefly's hold
# the 26 categories and 168 rules phase 2 imports; dump in utilities:~/backups/finance/).
# Kuma monitors paused. Don't 'up' this without re-adding them to the HA outage automation.
services:
  actual-budget:
    image: actualbudget/actual-server:latest
    container_name: actual-budget
    labels:
      - "snadboy.revp.5006.domain=actual.isnadboy.com"
      - "docktail.service.enable=true"
      - "docktail.service.name=actual"
      - "docktail.service.port=5006"
      - "docktail.service.service-port=443"
    environment:
      - TZ=America/Chicago
    volumes:
      # Use named volume for SQLite - CIFS/network storage causes locking issues
      - actual-budget-data:/data
    ports:
      - 5006:5006
    restart: unless-stopped

volumes:
  actual-budget-data:
    external: true
    # Pre-created volume for SQLite - CIFS/network storage causes locking issues
    # Create with: docker volume create actual-budget-data
