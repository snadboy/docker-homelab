services:
  zigbee2mqtt-laundry:
    image: koenkk/zigbee2mqtt
    container_name: zigbee2mqtt-laundry
    restart: unless-stopped
    ports:
      - "8083:8080"
    volumes:
      - /mnt/docker/zigbee2mqtt/zigbee2mqtt-laundry/app-data:/app/data
    environment:
      - TZ=America/Chicago
    # DockTail labels removed 2026-09-20: this instance is retired on purpose
    # (empty shell, container left exited) and its VIP service definition was
    # deleted. Re-adding them would re-advertise a dead service. Do not.
